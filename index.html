<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>極速通勤</title>
<meta name="theme-color" content="#0E100F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="極速通勤">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0E100F; --surface:#1A1C1B; --surface2:#252726; --line:#262827;
  --text:#F1F2EF; --muted:#8E918D; --dim:#5E615D;
  --lime:#C6F135; --ink:#0E100F; --warn:#FFB03A; --bad:#FF5B4F;
  color-scheme:dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E100F; } }
:root[data-theme="dark"]{ --bg:#0E100F; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;min-height:100vh;min-height:100lvh}
/* iOS 獨立 PWA：文件比螢幕短時，fixed 底部會跟著文件高度上移；讓 html/body 永遠至少滿版 */
body{margin:0;min-height:100%;min-height:100lvh;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--text);
  font-family:-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
svg{display:block}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
.wrap{overflow-x:clip;max-width:560px;margin:0 auto;padding:0 20px calc(130px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;background:rgba(14,16,15,.74);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);margin:8px -10px 0;padding:10px 14px 4px;border-radius:30px;border:1px solid #2A2C2B}
.safe-cover{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);z-index:35;background:rgba(14,16,15,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;min-height:64px}
.brand h1{margin:0;font-size:46px;line-height:1;font-weight:900;letter-spacing:-1.5px;color:var(--lime)}
.brand .ico{color:var(--lime);width:40px;height:40px;flex:none;display:grid;place-items:center}.brand .ico svg{width:40px;height:40px}.brand .ico:empty{display:none}
.meta{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px;color:var(--muted);font-size:13px}
.meta .live{display:flex;align-items:center;gap:6px}
.meta .live i{width:7px;height:7px;border-radius:50%;background:var(--lime);display:inline-block}
.meta .live.err i{background:var(--bad)}
.refresh{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);color:var(--text);font-size:13px}
.refresh svg{width:16px;height:16px}
.refresh.spin svg{animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:0 22px;height:64px;margin-bottom:22px}
.search svg{width:26px;height:26px;color:var(--lime);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font-size:18px;outline:none}
.search input::placeholder{color:var(--dim)}
.clear{color:var(--muted);font-size:14px}

/* sections */
.sec{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 12px}
.sec h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-0.5px}
.sec .side{color:var(--muted);font-size:14px}
.sec .live-tag{display:flex;align-items:center;gap:6px;color:var(--lime);font-weight:700;font-size:16px}
.sec .live-tag svg{width:24px;height:24px}
.sub{color:var(--muted);font-size:14px;margin:-4px 2px 12px}

/* cards */
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:30px;padding:18px 16px 18px 18px;margin-bottom:12px}
.card:active{background:#202221}
.badge{width:52px;height:52px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--lime)}
.badge svg{width:26px;height:26px}
.card .body{flex:1;min-width:0}
.card .title{font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-0.2px}
.card .desc{color:var(--muted);font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;background:var(--surface2);color:var(--lime);font-weight:700;font-size:15px;padding:8px 13px;border-radius:999px;white-space:nowrap}
.chev{flex:none;color:var(--dim);width:20px;height:20px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 20px;font-size:18px;font-weight:600}
.chip:active{background:var(--surface2)}
.chip.chip-on{background:var(--lime);color:var(--ink);border-color:var(--lime)}

/* stop block (bus tab) */
.stop{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:18px 18px 8px;margin-bottom:14px}
.stop-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.side-tag{display:inline-block;vertical-align:middle;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;background:var(--surface2)}.side-tag.same{color:var(--lime)}.side-tag.opp{color:var(--muted)}
.stop-h .name{flex:1;font-size:21px;font-weight:800}
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rno{min-width:64px;font-size:21px;font-weight:800;letter-spacing:-0.3px}
.rdest{flex:1;min-width:0;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta{flex:none;min-width:76px;text-align:center;padding:7px 12px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:16px}
.eta.hot{background:var(--lime);color:var(--ink)}
.eta.soon{color:var(--lime)}
.eta.off{color:var(--muted);font-weight:600;font-size:14px}
.more{display:block;width:100%;padding:12px 0 10px;color:var(--lime);font-weight:600;font-size:15px;border-top:1px solid var(--line)}

/* bike */
.bike{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:18px;margin-bottom:14px}
.bike-h{display:flex;align-items:flex-start;gap:12px}
.bike-h .name{flex:1;font-size:20px;font-weight:800;line-height:1.3}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.num{background:var(--surface2);border-radius:20px;padding:12px 14px}
.num b{display:block;font-size:34px;line-height:1;font-weight:800;letter-spacing:-1px}
.num span{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.c-ok{color:var(--lime)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-off{color:var(--muted)}

/* empty / fav */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:34px;padding:38px 26px;text-align:center}
.empty .star{width:76px;height:76px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;margin:0 auto 18px}
.empty .star svg{width:40px;height:40px}
.empty h3{margin:0 0 10px;font-size:23px;font-weight:800}
.empty p{margin:0;color:var(--muted);font-size:16px;line-height:1.6}
.note{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;color:var(--muted);font-size:15px;line-height:1.6}
.note b{color:var(--text)}
.demo{display:inline-block;background:var(--surface2);color:var(--warn);border-radius:999px;padding:3px 10px;font-size:12px;margin-left:6px}

/* skeleton */
.sk{height:96px;border-radius:30px;background:var(--surface);margin-bottom:12px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(560px,calc(100% - 28px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px;
  background:rgba(32,34,33,.72);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid #2E302F;border-radius:40px;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-radius:32px;color:#D9DBD7;font-size:12px;font-weight:600;white-space:nowrap}
.tab svg{width:28px;height:28px}
.tab{position:relative;z-index:1;transition:color .2s}
.tab.on{color:var(--lime)}
.tab-ind{position:absolute;top:7px;bottom:7px;left:0;border-radius:32px;background:#121413;z-index:0;transition:transform .3s cubic-bezier(.25,.8,.3,1),width .3s cubic-bezier(.25,.8,.3,1)}
#main.swipe{will-change:transform}
#main{position:relative} .mghost{position:absolute;width:100%;pointer-events:none}
@media (prefers-reduced-motion: reduce){ .tab-ind{transition:none} }

/* route page */
.page{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .28s ease}
.page.open{transform:none}
.page.drag{transition:none;box-shadow:-12px 0 30px rgba(0,0,0,.5)}
.sheet.drag{transition:none}
.page-dim{position:fixed;inset:0;z-index:29;background:#000;opacity:0;pointer-events:none}
.page .wrap{padding-bottom:60px}
.ptop{position:sticky;top:8px;z-index:2;background:rgba(14,16,15,.74);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);margin:8px -10px 10px;padding:8px 14px 14px;border-radius:30px;border:1px solid #2A2C2B}
.back{display:flex;align-items:center;gap:4px;color:var(--lime);font-size:17px;font-weight:600;padding:6px 0}
.back svg{width:22px;height:22px}
.rhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.rhead h1{margin:0;font-size:52px;line-height:1;font-weight:900;letter-spacing:-1.5px;color:var(--lime)}
.dirbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;max-width:60%}
.dirbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead h1.trip{white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px}
.rhead .dirbtn.trip{min-width:0;flex:0 1 auto}
.lblk{position:relative;overflow:hidden;margin:0 -4px;padding:0 4px}
.pghost{position:absolute;left:0;right:0;padding:0 4px;pointer-events:none}
.page.under{transform:none;z-index:29;transition:none;pointer-events:none}
.dirbtn svg{width:18px;height:18px;color:var(--lime);flex:none}
.rmeta{color:var(--muted);font-size:14px;margin-top:10px}
.line{position:relative;margin-top:8px}
.st{position:relative;display:flex;align-items:center;gap:14px;padding:12px 0 12px 34px;min-height:58px}
.st::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line)}
.st:first-child::before{top:50%} .st:last-child::before{bottom:50%}
.dot{position:absolute;left:5px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
.st.bus .dot{width:26px;height:26px;left:-1px;margin-top:-13px;background:var(--lime);border:0;display:grid;place-items:center;color:var(--ink)}
.st.bus .dot svg{width:16px;height:16px}
.st .sn{flex:1;min-width:0;font-size:17px;font-weight:600;text-align:left;padding:4px 0}
.st .sn small{display:block;color:var(--dim);font-size:12px;font-weight:500;margin-top:2px}
.st.here{background:var(--surface);border-radius:20px;margin:4px -10px;padding-left:44px;padding-right:10px}
.st.here::before{left:21px} .st.here .dot{left:15px;border-color:var(--lime)} .st.here.bus .dot{left:9px}
.st.here .sn{color:var(--lime)}
.fav{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--dim)}
.fav svg{width:22px;height:22px}
.fav.on{color:var(--lime)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#161817;border-top:1px solid #2A2C2B;
  border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .26s ease;max-width:600px;margin:0 auto}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#3A3C3B;margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:26px;font-weight:800;line-height:1.25}
.sheet .addr{color:var(--muted);font-size:15px;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;padding:12px 2px;border-top:1px solid var(--line);font-size:16px}
.kv span{color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}
.btn{height:56px;border-radius:999px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:22px;height:22px}
.btn.pri{background:var(--lime);color:var(--ink)}
.btn.sec2{background:var(--surface2);color:var(--text);padding:0 20px}
.btn.sec2.on{color:var(--lime)}

/* rail */
.sys{display:inline-block;font-size:12px;font-weight:700;color:var(--ink);background:var(--lime);border-radius:999px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.lb{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:7px;font-size:12px;font-weight:800;color:#fff;background:#4A4D4A;margin-right:4px}
.trow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.ttime{flex:none;width:62px;font-size:22px;font-weight:800;letter-spacing:-0.5px}
.tmain{flex:1;min-width:0}
.tmain .td{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmain .tt{font-size:13px;color:var(--muted);margin-top:3px}
.delay{flex:none;padding:6px 11px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:700}
.delay.ok{color:var(--lime)} .delay.late{color:var(--warn)} .delay.na{color:var(--dim);font-weight:600}
.seats{flex:none;text-align:right;font-size:13px;line-height:1.5;color:var(--muted)}
.seats b.ok{color:var(--lime)} .seats b.few{color:var(--warn)} .seats b.full{color:var(--bad)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:6px 16px;margin-top:6px}
.lsec{display:flex;align-items:center;gap:10px;margin:22px 4px 2px;font-size:19px;font-weight:800}.lsec:first-of-type{margin-top:8px}.lsec .lb{font-size:14px}
.nrow{display:flex;width:100%;text-align:left;align-items:center;gap:10px}.nrow .chev{color:var(--dim)}
.mapslot{margin:4px 0 6px}
.mapcard{position:relative;height:230px;border-radius:30px;overflow:hidden;background:#1b1d1f;isolation:isolate;touch-action:none}
.mapcard .mapbox{position:absolute!important;inset:0;background:#1b1d1f}
.mapload{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:14px}
.maprc{position:absolute;right:12px;top:12px;z-index:500;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(30,32,34,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--lime);border:1px solid rgba(255,255,255,.1)}
.maprc svg{width:20px;height:20px}
.mpin{width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;border:2px solid #111;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
.mpin svg{width:16px;height:16px}
.mpin.bs{background:#3d8bff;color:#fff}.mpin.bk{background:#ffb400;color:#111;width:26px;height:26px}.mpin.rl{z-index:2}.mpin.rl{background:var(--lime);color:#111}
.mdot{width:20px;height:20px;border-radius:50%;background:#4ea1ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(78,161,255,.25)}
.mapcard .maplibregl-ctrl-attrib{background:rgba(0,0,0,.55)!important;color:#aaa;font-size:10px}.mapcard .maplibregl-ctrl-attrib a{color:#ccc}.mapcard .maplibregl-ctrl-attrib-button{filter:invert(1)}
.lnk{display:block;width:100%;text-align:left;color:inherit;font:inherit;padding:0;background:none;border:0}
button.board.lnk{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:6px 16px;margin-top:6px}
button.tgrp.lnk{display:flex;width:auto;margin:14px 6px 0;padding:0;align-items:center}.tgrp.lnk span{display:inline-flex;align-items:center;gap:2px}.tgrp.lnk svg{width:14px;height:14px}
.trlnk + .trlnk .trow,.trlnk .trow{width:100%}
.st.past .sn{color:var(--dim)}
.badge.sysb{color:var(--lime)}.badge.sysb .slogo{width:30px;height:30px}
.mpin .slogo{width:18px;height:18px}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin:8px 0 4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:999px;background:var(--lime);transform:translateX(calc(var(--i) * 100%));transition:transform .25s ease}
.seg button,.seg span{position:relative;z-index:1;padding:8px 8px;border-radius:999px;font-weight:700;font-size:13.5px;line-height:1.25;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;color:var(--muted)}
.seg button{transition:color .2s} .seg button.on{color:var(--ink);background:none} .seg.one{grid-template-columns:1fr} .seg.one span{color:var(--text,#fff);text-align:center}
@media (prefers-reduced-motion: reduce){.seg i{transition:none}}
.lstops{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--lime)} .lstops svg{width:14px;height:14px}
.ltag{display:block;font-size:10px;font-weight:600;opacity:.75;margin-top:1px;white-space:nowrap}
.ltag.late{color:var(--warn);opacity:1}
.eta.sch{color:var(--text)} .eta.sch .ltag{color:var(--muted);opacity:1}
.tt b.seat{font-weight:700} .tt b.seat.ok{color:var(--lime)} .tt b.seat.few{color:var(--warn)} .tt b.seat.full{color:var(--bad)}
.lastt{font-size:11px;color:var(--warn);font-weight:700}
.dgrp{margin-top:6px;font-size:14px}
.tgrp{display:flex;align-items:baseline;justify-content:space-between;margin:14px 6px 0;font-size:15px;font-weight:700}.tgrp span{font-size:13px;font-weight:500;color:var(--muted)}
.rsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:14px}
.navbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--lime);font-weight:700;font-size:14px}
.navbtn svg{width:16px;height:16px}

/* settings */
.set{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:12px}
.set h3{margin:0 0 4px;font-size:18px;font-weight:700}

/* ---------- 捷運路線／火車車次 停靠站頁 ---------- */
function openLine(req) {

/* 換頁動畫（iOS 風格）：新頁從右邊滑入，底下那頁同時往左移30%（視差）；返回則相反 */

function slideEls(els, from, to, ms, done) {

  for (const e of els) { e.style.transition = ms ? `transform ${ms}ms ease` : 'none'; e.style.transform = to ? `translateX(${to}px)` : ''; }
  setTimeout(() => { for (const e of els) { e.style.transition = ''; } done && done(); }, ms + 20);
}
function pushAnim(renderNew) {

  const snap = document.createElement('section'); snap.className = 'page under'; snap.innerHTML = pg.innerHTML;
  const top = pg.scrollTop; pg.before(snap); snap.scrollTop = top;
  renderNew();
  pg.classList.add('drag');

}
function popAnim() {   // 返回按鍵：停靠站頁 → 車站頁

  pg.before(under); under.scrollTop = S.railScroll || 0;

    closeRoute(true); pg.classList.remove('drag');
    pg.style.transition = 'none'; pg.style.transform = ''; pg.offsetWidth; pg.style.transition = '';

}
function lineReqFromGroup(o) {

}
async function loadLine(scroll) {

/* ---------- route page ---------- */
function openRoute(r) {
  S.page = 'route';
  S.route = { routeUID:r.routeUID, route:r.route, dirNum:r.dirNum ?? 0, stopUID:r.stopUID, stopName:r.stopName, dest:r.dest };
  S.routeData = null; S.routeError = null;
  const p = $('#routePage'); if (!p.classList.contains('open') && !reduceMotion()) slideEls(baseEls(), 0, -innerWidth * PARA, 280, () => slideEls(baseEls(), 0, 0, 0)); p.classList.add('open'); p.setAttribute('aria-hidden','false'); p.scrollTop = 0;
  renderRoute(); loadRoute(true);
}
function closeRoute(quiet) {
  if (S.page === 'line' && S.rail) {
    if (!quiet) { popAnim(); return; }
    S.page = 'rail'; S.line = null; renderRail(); $('#routePage').scrollTop = S.railScroll || 0; return;
  }
  if (S.back && S.back.length) { stackPop(quiet); return; }   // 路線規劃的頁面堆疊：回到上一頁
  S.back = []; clearTimeout(typeof planLiveT === 'number' ? planLiveT : 0);
  if (!quiet && !reduceMotion()) slideEls(baseEls(), -innerWidth * PARA, 0, 280);   // 底下的主畫面跟著滑回來
  S.line = null; S.route = null; S.rail = null; S.page = null; const p = $('#routePage'); p.classList.remove('open'); p.setAttribute('aria-hidden','true'); render(); }

  S.routeLoading = true; renderRoute();
  let data = null, err = null;
  try { data = await api('route', { ...R }); } catch (e) { err = e.message; }
  if (tok !== S.routeTok || S.route !== R) return;
  if (data) { S.routeData = data; S.routeError = null; } else S.routeError = err || '沒有資料';
  S.routeLoading = false; renderRoute();

}

/* ---------- 路線規劃（v2.13.0）：首頁標題下方的「路線規劃」橫條（v2.15.0） → 規劃頁（推進頁面堆疊，右滑返回） ---------- */
// 頁面堆疊：規劃頁 → 選地點頁／路線詳情 → 車站頁／公車路線頁；S.back 記錄底下的頁面，返回時依序回去
const PLAN_PREF_KEY = 'jisu_plan_pref', PLAN_RECENT_KEY = 'jisu_plan_recent';
const PLAN_MODES = [['bus','公車',5],['mrt','捷運',6],['lrt','輕軌',7],['tra','台鐵',4],['thsr','高鐵',3]];
function planInit() {
  if (S.plan) return S.plan;
  let pref = {}; try { pref = JSON.parse(localStorage.getItem(PLAN_PREF_KEY)) || {}; } catch (e) {}
  if (pref.pref !== undefined) { delete pref.pref; try { localStorage.setItem(PLAN_PREF_KEY, JSON.stringify(pref)); } catch (e) {} }   // v2.15.0 起拿掉「最快／最便宜」，一律最快
  return S.plan = { o:null, d:null, when:'now', time:null, modes: pref.modes || { bus:1, mrt:1, lrt:1, tra:1, thsr:1, bike:0 }, res:null, loading:false, err:null, live:{}, sel:null };
}
function planSavePref() { try { localStorage.setItem(PLAN_PREF_KEY, JSON.stringify({ modes:S.plan.modes })); } catch (e) {} }
const hereName = () => '目前位置';
function planHere() { const d = S.data; return d && d.lat ? { name:hereName(), lat:d.lat, lon:d.lon, here:true } : null; }
function openPlan() {
  const P = planInit(); S.back = [];
  if (!P.o) P.o = planHere();
  S.page = 'plan';
  const p = $('#routePage'); if (!p.classList.contains('open') && !reduceMotion()) slideEls(baseEls(), 0, -innerWidth * PARA, 280, () => slideEls(baseEls(), 0, 0, 0));
  p.classList.add('open'); p.setAttribute('aria-hidden','false'); p.scrollTop = 0;
  renderPage();
  if (!P.o) api('locate').then(l => { if (!P.o) { P.o = { name:hereName(), lat:l.latitude, lon:l.longitude, here:true }; if (S.page === 'plan') renderPage(); } }).catch(() => {});
}
const PLAN_PAGES = ['plan','planPick','planDetail'];
function pageHtml(pg) { return pg === 'plan' ? planHtml() : pg === 'planPick' ? pickHtml() : pg === 'planDetail' ? detailHtml() : ''; }
function renderPage() {
  if (!PLAN_PAGES.includes(S.page)) return;
  const pg = $('#routePage'); pg.innerHTML = pageHtml(S.page);
  if (S.page === 'planDetail') mountPlanMap();
}
function stackPush(fn) { S.back = S.back || []; S.back.push({ page:S.page, scroll:$('#routePage').scrollTop }); pushAnim(fn); }
function stackRestore(e) { S.page = e.page; S.rail = null; S.line = null; S.route = null; renderPage(); $('#routePage').scrollTop = e.scroll || 0; }
function stackPop(quiet) {
  const e = S.back.pop(), pg = $('#routePage');
  if (quiet || reduceMotion()) { stackRestore(e); return; }
  const under = document.createElement('section'); under.className = 'page under';
  const keep = S.page; S.page = e.page; under.innerHTML = pageHtml(e.page); S.page = keep;
  pg.before(under); under.scrollTop = e.scroll || 0;

    stackRestore(e); pg.classList.remove('drag');

// 右滑返回時墊在底下的頁面
function underPage() {
  if (S.page === 'line' && S.rail) return { html: railHtml(), scroll: S.railScroll || 0 };
  if (S.back && S.back.length) { const e = S.back[S.back.length - 1], keep = S.page; S.page = e.page; const html = pageHtml(e.page); S.page = keep; return { html, scroll: e.scroll || 0 }; }

/* 規劃頁 */
const placeTxt = p => p ? esc(p.name) : '<span style="color:var(--dim)">選擇地點</span>';
const pad2 = n => String(n).padStart(2, '0');
const localIso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function planHtml() {

    <div class="rhead"><h1 style="font-size:40px">路線規劃</h1></div></div>
    <div class="pbox"><div>
      <button class="pfield" data-act="planPick" data-v="o"><i class="pdot"></i><span class="pf"><b>起點</b><span>${placeTxt(P.o)}</span></span></button>

    <div class="sseg pseg">${[['now','現在出發'],['dep','指定出發'],['arr','指定抵達']].map(([k, l]) => `<button class="${P.when === k ? 'on' : ''}" data-act="planWhen" data-v="${k}">${l}</button>`).join('')}</div>
    ${P.when !== 'now' ? `<input id="planTime" class="inp" type="datetime-local" value="${esc(P.time || localIso(new Date(Date.now() + 15 * 60000)))}" min="${localIso(new Date())}">` : ''}

    <div class="chips mchips">${PLAN_MODES.map(([k, l]) => `<button class="chip ${P.modes[k] ? 'chip-on' : ''}" data-act="planMode" data-v="${k}">${l}</button>`).join('')}<button class="chip ${P.modes.bike ? 'chip-on' : ''}" data-act="planMode" data-v="bike">YouBike</button></div>
    <button class="btn pri pgo" data-act="planGo" ${P.o && P.d ? '' : 'disabled'}>${P.loading ? '規劃中…' : P.res ? '重新規劃' : '規劃路線'}</button>`;

    h += P.res.length ? P.res.map((r, i) => planCard(r, i)).join('') : `<div class="note">找不到可行的路線。試著打開更多交通工具，或換個時間。</div>`;
    if (P.res.some(r => r.approx)) h += `<div class="sub" style="margin-top:8px">標「≈」的步行段是把計程車接駁換成步行估算的時間。</div>`;
  }

      { op:'TRTC', sys:'北捷', kind:'metro', ids:['R20'], name:'明德', lines:['R'], dist:1420, exit:'2號出口', lat:25.1097, lon:121.5189 },
      { op:'TRA', sys:'台鐵', kind:'tra', ids:['1000'], name:'臺北', lines:[], dist:9800, far:true, lat:25.0478, lon:121.5170 },
      { op:'THSR', sys:'高鐵', kind:'thsr', ids:['1000'], name:'台北', lines:[], dist:9850, far:true, lat:25.0478, lon:121.5170 },
    ];
    return { busStops, bikes, favs, rail };
  }
  if (action === 'railBoard') {
    const now = new Date(), base = now.getHours() * 60 + now.getMinutes();
    const t = m => { const x = (base + m) % 1440; return String(Math.floor(x / 60)).padStart(2,'0') + ':' + String(x % 60).padStart(2,'0'); };
    if (p.kind === 'tra') return { kind:'tra', live:true, note:null, trains:[
      { time:t(4), type:'區間', no:'1187', dest:'基隆', delay:0 }, { time:t(9), type:'自強', no:'152', dest:'七堵', delay:6 },
      { time:t(12), type:'區間快', no:'4012', dest:'新竹', delay:0 }, { time:t(17), type:'莒光', no:'611', dest:'臺東', delay:null },
      { time:t(23), type:'區間', no:'1191', dest:'蘇澳', delay:2 }, { time:t(31), type:'自強', no:'418', dest:'花蓮', delay:0 } ] };
    if (p.kind === 'thsr') return { kind:'thsr', live:true, note:null, trains:[
      { time:t(6), no:'615', dest:'左營', seats:{ std:'ok', biz:'few' } }, { time:t(16), no:'1217', dest:'左營', seats:{ std:'few', biz:'ok' } },
      { time:t(26), no:'0816', dest:'南港', seats:{ std:'ok', biz:'ok' } }, { time:t(36), no:'121', dest:'左營', seats:{ std:'full', biz:'few' } } ] };
    return { kind:'metro', live:true, note:null, trains:[ { line:'R', dest:'淡水', eta:1 }, { line:'R', dest:'象山', eta:3 }, { line:'R', dest:'北投', eta:7 }, { line:'R', dest:'大安', eta:9 } ] };
  }
  if (action === 'route') {
    const names = ['捷運石牌站','石牌國小','石牌路一段','振興醫院','榮總(石牌路)','榮總院區','榮光新村(榮總東院)','陽明大學','東華街口','天母國中','天母圓環','中山北路七段','天母運動公園','德行東路','芝山岩','雨農國小','士林區行政中心','捷運士林站','捷運劍潭站','圓山','民權西路口','中山國小','南京東路','市政府'];
    const list = p.dirNum === 1 ? [...names].reverse() : names;
    let t = rnd(-400, 60);
    const stops = list.map((name, i) => { t += rnd(60, 150); return { seq:i+1, name, uid:'R'+i, sec: t < 0 ? null : t, status: t < 0 ? 0 : 0, bus:false, here: name === p.stopName }; });
    stops.forEach(s => { if (s.sec == null) s.sec = 0; });
    [2, 9, 16].forEach(i => { if (stops[i]) { stops[i].bus = true; stops[i].sec = 20; stops[i].plate = 'EAL-0' + rnd(100, 999); } });
    return { routeUID:p.routeUID, route:p.route, dirs:[0,1], dest:{ [p.dirNum]: p.dest || list[list.length-1], [p.dirNum ? 0 : 1]: list[0] }, stops };
  }
}
