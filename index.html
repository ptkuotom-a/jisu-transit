<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>極速通勤</title>
<meta name="theme-color" content="#0E100F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="極速通勤">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0E100F; --surface:#1A1C1B; --surface2:#252726; --line:#262827;
  --text:#F1F2EF; --muted:#8E918D; --dim:#5E615D;
  --lime:#C6F135; --ink:#0E100F; --warn:#FFB03A; --bad:#FF5B4F;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E100F; } }
:root[data-theme="dark"]{ --bg:#0E100F; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
svg{display:block}
html{overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 130px}

/* header */
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;background:rgba(14,16,15,.74);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);margin:8px -10px 0;padding:10px 14px 4px;border-radius:30px;border:1px solid #2A2C2B}
.safe-cover{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);z-index:35;background:rgba(14,16,15,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;min-height:64px}
.brand h1{margin:0;font-size:46px;line-height:1;font-weight:900;letter-spacing:-1.5px;color:var(--lime)}
.brand .ico{color:var(--lime);width:40px;height:40px}
.meta{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px;color:var(--muted);font-size:13px}
.meta .live{display:flex;align-items:center;gap:6px}
.meta .live i{width:7px;height:7px;border-radius:50%;background:var(--lime);display:inline-block}
.meta .live.err i{background:var(--bad)}
.refresh{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);color:var(--text);font-size:13px}
.refresh svg{width:16px;height:16px}
.refresh.spin svg{animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:0 22px;height:64px;margin-bottom:22px}
.search svg{width:26px;height:26px;color:var(--lime);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font-size:18px;outline:none}
.search input::placeholder{color:var(--dim)}
.clear{color:var(--muted);font-size:14px}

/* sections */
.sec{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 12px}
.sec h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-0.5px}
.sec .side{color:var(--muted);font-size:14px}
.sec .live-tag{display:flex;align-items:center;gap:6px;color:var(--lime);font-weight:700;font-size:16px}
.sec .live-tag svg{width:24px;height:24px}
.sub{color:var(--muted);font-size:14px;margin:-4px 2px 12px}

/* cards */
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:30px;padding:18px 16px 18px 18px;margin-bottom:12px}
.card:active{background:#202221}
.badge{width:52px;height:52px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--lime)}
.badge svg{width:26px;height:26px}
.card .body{flex:1;min-width:0}
.card .title{font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-0.2px}
.card .desc{color:var(--muted);font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;background:var(--surface2);color:var(--lime);font-weight:700;font-size:15px;padding:8px 13px;border-radius:999px;white-space:nowrap}
.chev{flex:none;color:var(--dim);width:20px;height:20px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 20px;font-size:18px;font-weight:600}
.chip:active{background:var(--surface2)}
.chip.chip-on{background:var(--lime);color:var(--ink);border-color:var(--lime)}

/* stop block (bus tab) */
.stop{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:18px 18px 8px;margin-bottom:14px}
.stop-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.side-tag{display:inline-block;vertical-align:middle;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;background:var(--surface2)}.side-tag.same{color:var(--lime)}.side-tag.opp{color:var(--muted)}
.stop-h .name{flex:1;font-size:21px;font-weight:800}
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rno{min-width:64px;font-size:21px;font-weight:800;letter-spacing:-0.3px}
.rdest{flex:1;min-width:0;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta{flex:none;min-width:76px;text-align:center;padding:7px 12px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:16px}
.eta.hot{background:var(--lime);color:var(--ink)}
.eta.soon{color:var(--lime)}
.eta.off{color:var(--muted);font-weight:600;font-size:14px}
.more{display:block;width:100%;padding:12px 0 10px;color:var(--lime);font-weight:600;font-size:15px;border-top:1px solid var(--line)}

/* bike */
.bike{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:18px;margin-bottom:14px}
.bike-h{display:flex;align-items:flex-start;gap:12px}
.bike-h .name{flex:1;font-size:20px;font-weight:800;line-height:1.3}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.num{background:var(--surface2);border-radius:20px;padding:12px 14px}
.num b{display:block;font-size:34px;line-height:1;font-weight:800;letter-spacing:-1px}
.num span{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.c-ok{color:var(--lime)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-off{color:var(--muted)}

/* empty / fav */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:34px;padding:38px 26px;text-align:center}
.empty .star{width:76px;height:76px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;margin:0 auto 18px}
.empty .star svg{width:40px;height:40px}
.empty h3{margin:0 0 10px;font-size:23px;font-weight:800}
.empty p{margin:0;color:var(--muted);font-size:16px;line-height:1.6}
.note{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;color:var(--muted);font-size:15px;line-height:1.6}
.note b{color:var(--text)}
.demo{display:inline-block;background:var(--surface2);color:var(--warn);border-radius:999px;padding:3px 10px;font-size:12px;margin-left:6px}

/* skeleton */
.sk{height:96px;border-radius:30px;background:var(--surface);margin-bottom:12px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(560px,calc(100% - 28px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px;
  background:rgba(32,34,33,.72);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid #2E302F;border-radius:40px;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-radius:32px;color:#D9DBD7;font-size:12px;font-weight:600;white-space:nowrap}
.tab svg{width:28px;height:28px}
.tab{position:relative;z-index:1;transition:color .2s}
.tab.on{color:var(--lime)}
.tab-ind{position:absolute;top:7px;bottom:7px;left:0;border-radius:32px;background:#121413;z-index:0;transition:transform .32s cubic-bezier(.3,1.25,.5,1),width .32s}
#main.swipe{will-change:transform}
@media (prefers-reduced-motion: reduce){ .tab-ind{transition:none} }

/* route page */
.page{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .28s ease}
.page.open{transform:none}
.page.drag{transition:none;box-shadow:-12px 0 30px rgba(0,0,0,.5)}
.sheet.drag{transition:none}
.page-dim{position:fixed;inset:0;z-index:29;background:#000;opacity:0;pointer-events:none}
.page .wrap{padding-bottom:60px}
.ptop{position:sticky;top:8px;z-index:2;background:rgba(14,16,15,.74);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);margin:8px -10px 10px;padding:8px 14px 14px;border-radius:30px;border:1px solid #2A2C2B}
.back{display:flex;align-items:center;gap:4px;color:var(--lime);font-size:17px;font-weight:600;padding:6px 0}
.back svg{width:22px;height:22px}
.rhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.rhead h1{margin:0;font-size:52px;line-height:1;font-weight:900;letter-spacing:-1.5px;color:var(--lime)}
.dirbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;max-width:60%}
.dirbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirbtn svg{width:18px;height:18px;color:var(--lime);flex:none}
.rmeta{color:var(--muted);font-size:14px;margin-top:10px}
.line{position:relative;margin-top:8px}
.st{position:relative;display:flex;align-items:center;gap:14px;padding:12px 0 12px 34px;min-height:58px}
.st::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line)}
.st:first-child::before{top:50%} .st:last-child::before{bottom:50%}
.dot{position:absolute;left:5px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
.st.bus .dot{width:26px;height:26px;left:-1px;margin-top:-13px;background:var(--lime);border:0;display:grid;place-items:center;color:var(--ink)}
.st.bus .dot svg{width:16px;height:16px}
.st .sn{flex:1;min-width:0;font-size:17px;font-weight:600}
.st .sn small{display:block;color:var(--dim);font-size:12px;font-weight:500;margin-top:2px}
.st.here{background:var(--surface);border-radius:20px;margin:4px -10px;padding-left:44px;padding-right:10px}
.st.here::before{left:21px} .st.here .dot{left:15px;border-color:var(--lime)} .st.here.bus .dot{left:9px}
.st.here .sn{color:var(--lime)}
.fav{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--dim)}
.fav svg{width:22px;height:22px}
.fav.on{color:var(--lime)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#161817;border-top:1px solid #2A2C2B;
  border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .26s ease;max-width:600px;margin:0 auto}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#3A3C3B;margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:26px;font-weight:800;line-height:1.25}
.sheet .addr{color:var(--muted);font-size:15px;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;padding:12px 2px;border-top:1px solid var(--line);font-size:16px}
.kv span{color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}
.btn{height:56px;border-radius:999px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:22px;height:22px}
.btn.pri{background:var(--lime);color:var(--ink)}
.btn.sec2{background:var(--surface2);color:var(--text);padding:0 20px}
.btn.sec2.on{color:var(--lime)}

/* rail */
.sys{display:inline-block;font-size:12px;font-weight:700;color:var(--ink);background:var(--lime);border-radius:999px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.lb{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:7px;font-size:12px;font-weight:800;color:#fff;background:#4A4D4A;margin-right:4px}
.trow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.ttime{flex:none;width:62px;font-size:22px;font-weight:800;letter-spacing:-0.5px}
.tmain{flex:1;min-width:0}
.tmain .td{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmain .tt{font-size:13px;color:var(--muted);margin-top:3px}
.delay{flex:none;padding:6px 11px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:700}
.delay.ok{color:var(--lime)} .delay.late{color:var(--warn)} .delay.na{color:var(--dim);font-weight:600}
.seats{flex:none;text-align:right;font-size:13px;line-height:1.5;color:var(--muted)}
.seats b.ok{color:var(--lime)} .seats b.few{color:var(--warn)} .seats b.full{color:var(--bad)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:6px 16px;margin-top:6px}
.tgrp{display:flex;align-items:baseline;justify-content:space-between;margin:14px 6px 0;font-size:15px;font-weight:700}.tgrp span{font-size:13px;font-weight:500;color:var(--muted)}
.rsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:14px}
.navbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--lime);font-weight:700;font-size:14px}
.navbtn svg{width:16px;height:16px}

/* settings */
.set{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:12px}
.set h3{margin:0 0 4px;font-size:18px;font-weight:700}
.set p{margin:0 0 12px;color:var(--muted);font-size:14px}
.inp{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;padding:0 14px;margin-bottom:8px;outline:none}
.inp:focus{border-color:var(--lime)}
.kmsg{margin-top:10px;font-size:14px;color:var(--muted)} .kmsg.ok{color:var(--lime)} .kmsg.bad{color:var(--bad)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);border-radius:999px;padding:5px}
.seg button{padding:10px 0;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--ink)}

@media (prefers-reduced-motion: reduce){ .page,.sheet,.scrim{transition:none} .refresh.spin svg,.sk::after{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="title">極速通勤</h1><span class="ico" id="titleIco"></span></div>
    <div class="meta"><span class="live" id="status"><i></i>定位中</span><button class="refresh" id="refreshBtn" aria-label="重新整理"></button></div>
    <label class="search" id="searchBar"><span id="searchIco"></span><input id="q" type="text" enterkeyhint="search" placeholder="搜尋附近路線、站牌、YouBike" autocomplete="off"><button class="clear" id="qClear" hidden>清除</button></label>
  </header>
  <main id="main"></main>
</div>

<div class="safe-cover"></div><nav class="tabbar" id="tabbar"></nav>
<div class="page-dim" id="pageDim"></div><section class="page" id="routePage" aria-hidden="true"></section>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="scrim" data-act="closeSheet"></div><div class="sheet" id="sheet"></div></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
const DEMO = /[?&]demo/.test(location.search);

/* ---------- icons ---------- */
const I = {
  bus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3.5"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r=".6" fill="currentColor"/><circle cx="16" cy="14.5" r=".6" fill="currentColor"/></svg>',
  busFill:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2.5h10A3.5 3.5 0 0 1 20.5 6v11a1.5 1.5 0 0 1-1.5 1.5h-.5V21a1 1 0 0 1-2 0v-2.5h-9V21a1 1 0 0 1-2 0v-2.5H5A1.5 1.5 0 0 1 3.5 17V6A3.5 3.5 0 0 1 7 2.5Zm-1.5 4V11h13V6.5Zm2 9.5a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Zm9 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/></svg>',
  bike:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 9h6l3.5 7.5M9 9 12 16.5h-1M14 5h2.5l1.5 4"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.3 2.6a1.1 1.1 0 0 1 1.4 0l8.6 7.2c.7.6.3 1.7-.6 1.7H19.5V20a1.5 1.5 0 0 1-1.5 1.5h-3.5v-5.5h-5v5.5H6A1.5 1.5 0 0 1 4.5 20v-8.5H3.3c-.9 0-1.3-1.1-.6-1.7Z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6c.7.3 1.3.6 1.9 1.1l2.5-.9 1.7 3-2 1.7c.1.7.1 1.4 0 2.1l2 1.7-1.7 3-2.5-.9c-.6.5-1.2.8-1.9 1.1l-.5 2.5h-3.4l-.5-2.5c-.7-.3-1.3-.6-1.9-1.1l-2.5.9-1.7-3 2-1.7a6.6 6.6 0 0 1 0-2.1l-2-1.7 1.7-3 2.5.9c.6-.5 1.2-.8 1.9-1.1ZM12 15.3a3.3 3.3 0 1 0 0-6.6 3.3 3.3 0 0 0 0 6.6Z"/></svg>',
  walk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.6" fill="currentColor"/><path d="m9 21 2.5-6 2.5 2.5V21M8 11l3-3.5 3 1.5 1.5 3H18M11 7.5 10 14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>',

/* ---------- state ---------- */
const S = {
  tab:'home', q:'', data:null, loading:false, error:null, lastFetch:0,
  settings:{busR:300, bikeR:500, railWalk:1.5, railFar:1, railSys:null, auto:30},
  rail:null, railData:null, railLoading:false, railError:null, page:null,
  favs:{bus:[], bike:[]},
  route:null, routeData:null, routeLoading:false, routeError:null,
  sheet:null, proxy:{},
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REG = new Map(); let regN = 0;
const reg = o => { if (REG.size > 4000) REG.clear(); REG.set(++regN, o); return regN; };

const api = DEMO ? (a, p) => demo(a, p) : (a, p) => window.dataApi(a, p);

/* ---------- formatting ---------- */
const distTxt = m => m == null ? '—' : m < 1000 ? `${m} 公尺` : `${(m/1000).toFixed(1)} 公里`;
const hhmm = s => { const d = new Date(s); return isNaN(d) ? '' : String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
function eta(r) {
  if (!r) return { t:'—', k:'off' };
  if (r.status === 0 && r.sec != null) {
    if (r.sec < 60) return { t:'進站中', k:'hot' };
    if (r.sec < 180) return { t:'將到站', k:'hot' };
    const m = Math.floor(r.sec / 60);
    return { t:`${m} 分`, k: m <= 5 ? 'soon' : '' };
  }
  if (r.status === 1) return { t: r.next ? hhmm(r.next) + ' 發車' : '尚未發車', k:'off' };
  return { t: ({2:'不停靠',3:'末班駛離',4:'今日停駛'})[r.status] || '無資料', k:'off' };
}
const etaRank = r => r.status === 0 && r.sec != null ? r.sec : r.status === 1 ? 1e6 : 2e6 + (r.status ?? 9);
const etaPill = r => { const e = eta(r); return `<span class="eta ${e.k}">${esc(e.t)}</span>`; };
function bikeCls(n, status) { if (status != null && status !== 1) return 'c-off'; if (n == null) return 'c-off'; if (n === 0) return 'c-bad'; if (n <= 3) return 'c-warn'; return 'c-ok'; }
const destTxt = r => r.dest ? `往 ${r.dest}` : (r.dirNum === 1 ? '返程' : '去程');
const busKey = f => `${f.routeUID}|${f.dirNum}|${f.stopUID}`;
const isFavBus = f => S.favs.bus.some(x => busKey(x) === busKey(f));
const isFavBike = uid => S.favs.bike.some(x => x.uid === uid);

/* ---------- render ---------- */
function renderChrome() {
  const titles = { home:'極速通勤', bus:'公車', bike:'YouBike', rail:'軌道', settings:'設定' };
  $('#title').textContent = titles[S.tab];
  $('#titleIco').innerHTML = S.tab === 'bike' ? I.bike : S.tab === 'rail' ? I.train : S.tab === 'settings' ? '' : I.bus;
  $('#searchBar').hidden = S.tab === 'settings';
  $('#searchIco').innerHTML = I.search;
  const tabs = [['home','首頁',I.home],['bus','公車',I.busFill],['bike','YouBike',I.bike],['rail','軌道',I.train],['settings','設定',I.gear]];
  const tb = $('#tabbar'), prev = tb.querySelector('.tab-ind')?.style.transform || '';
  tb.innerHTML = `<span class="tab-ind"></span>` + tabs.map(([k,l,ic]) => `<button class="tab ${S.tab===k?'on':''}" data-act="tab" data-v="${k}" aria-label="${l}">${ic}<span>${l}</span></button>`).join('');
  moveInd(prev);
  renderStatus();
}
// 分頁指示膠囊：從舊位置滑到新位置
function moveInd(prev) {
  const tb = $('#tabbar'), ind = tb.querySelector('.tab-ind'), on = tb.querySelector('.tab.on'); if (!ind || !on) return;
  ind.style.width = on.offsetWidth + 'px';
  const to = `translateX(${on.offsetLeft}px)`;
  if (prev && prev !== to) { ind.style.transition = 'none'; ind.style.transform = prev; ind.offsetWidth; ind.style.transition = ''; }
  ind.style.transform = to;
}
addEventListener('resize', () => moveInd(''));
const TAB_ORDER = ['home','bus','bike','rail','settings'];
function setTab(k) { S.tab = k; window.scrollTo(0,0); render(); }
function renderStatus() {
  const st = $('#status');
  st.className = 'live' + (S.error ? ' err' : '');
  st.innerHTML = '<i></i>' + (S.error === 'NO_PROXY' ? '尚未設定資料來源' : S.loading && !S.data ? '定位中…' : S.error ? '更新失敗' : S.lastFetch ? `${hhmm(S.lastFetch)} 更新` : '') + (DEMO ? '<span class="demo">示範資料</span>' : '');
  const b = $('#refreshBtn');
  b.className = 'refresh' + (S.loading ? ' spin' : '');
  b.innerHTML = I.refresh + '<span>重新整理</span>';
}
function render() {
  renderChrome();
  const v = { home:vHome, bus:vBus, bike:vBike, rail:vRail, settings:vSettings }[S.tab];
  $('#main').innerHTML = v();
}
const skel = n => Array.from({length:n}, () => '<div class="sk"></div>').join('');
function errBox() {
  if (S.error === 'NO_PROXY') return `<div class="empty" style="margin-top:6px"><div class="star">${I.bus}</div><h3>先設定資料來源</h3>
    <p>即時資料經由你自己的 Cloudflare Worker 向交通部 TDX 取得。到「設定」填入 Worker 網址就能開始使用。</p>
    <div class="btns" style="grid-template-columns:1fr"><button class="btn pri" data-act="tab" data-v="settings">前往設定</button></div></div>`;
  return S.error ? `<div class="note"><b>資料讀取失敗</b><br>${esc(S.error)}<br>確認定位權限與網路後，點右上角「重新整理」。</div>` : '';
}

const sideTag = s => s.side ? ` <span class="side-tag ${s.side === '同向' ? 'same' : 'opp'}">${s.side}</span>` : '';
function stopCard(s) {
  const routes = [...new Set(s.routes.map(r => r.route))].join('、');
  return `<button class="card" data-act="stop" data-i="${reg(s)}">
    <span class="badge">${I.walk}</span>
    <span class="body"><div class="title">${esc(s.name)}${sideTag(s)}</div><div class="desc">${esc(routes)}</div></span>
    <span class="pill">${distTxt(s.dist)}</span><span class="chev">${I.chev}</span></button>`;
}
function bikeCard(b) {
  const off = b.status != null && b.status !== 1;
  const d = off ? '暫停營運' : `借 <b class="${bikeCls(b.rent,b.status)}">${b.rent ?? '?'}</b>　還 <b class="${bikeCls(b.ret,b.status)}">${b.ret ?? '?'}</b>`;
  return `<button class="card" data-act="bikeSheet" data-i="${reg(b)}">
    <span class="badge">${I.bike}</span>
    <span class="body"><div class="title">${esc(b.name)}</div><div class="desc">${d}</div></span>
    <span class="pill">${distTxt(b.dist)}</span><span class="chev">${I.chev}</span></button>`;
}

function vHome() {
  if (S.error === 'NO_PROXY') return errBox();
  if (S.q) return vSearch();
  const d = S.data;
  let h = errBox();
  h += `<div class="sec"><h2>離你最近</h2></div>`;
  if (!d) h += S.error ? '' : skel(3);
  else {
    const mix = [...d.busStops.slice(0,2).map(s => ({k:'s', d:s.dist ?? 9e9, o:s})), ...d.bikes.slice(0,2).map(b => ({k:'b', d:b.dist, o:b})), ...(d.rail || []).filter(r => !r.far && !r.fallback).slice(0,1).map(r => ({k:'r', d:r.dist, o:r}))].sort((a,b) => a.d - b.d);
    h += mix.length ? mix.map(x => x.k === 's' ? stopCard(x.o) : x.k === 'r' ? railCard(x.o) : bikeCard(x.o)).join('') : `<div class="note">附近 ${S.settings.busR} 公尺內沒有公車站牌、${S.settings.bikeR} 公尺內沒有 YouBike。到「設定」加大搜尋範圍。</div>`;
    const routes = uniqRoutes(d).slice(0, 10);
    if (routes.length) {
      h += `<div class="sec"><h2 style="font-size:20px;color:var(--muted);font-weight:700">附近路線</h2></div><div class="chips">` +
        routes.map(r => `<button class="chip" data-act="route" data-i="${reg(r)}">${esc(r.route)}</button>`).join('') + `</div>`;
    }
  }
  h += `<div class="sec"><h2>我的收藏</h2><span class="live-tag">${I.signal}即時</span></div>`;
  h += vFavs();
  return h;
}
function uniqRoutes(d) {
  const seen = new Map();
  for (const s of d.busStops) for (const r of s.routes) if (!seen.has(r.route)) seen.set(r.route, { ...r, stopName: s.name });
  return [...seen.values()];
}
function vFavs() {
  const fb = S.favs.bus, fk = S.favs.bike;
  if (!fb.length && !fk.length) {
    return `<div class="empty"><div class="star">${I.star}</div><h3>收藏常搭的站牌和 YouBike</h3>
      <p>在路線頁點站牌旁的星號，或在 YouBike 站點按「收藏」，出門前一眼看到還有幾分鐘、還有幾台車。</p></div>`;
  }
  const live = S.data?.favs || { bus:{}, bike:{} };
  let h = '';
  for (const f of fb) {
    const r = live.bus?.[busKey(f)];
    h += `<button class="card" data-act="route" data-i="${reg(f)}">
      <span class="badge">${I.busFill}</span>
      <span class="body"><div class="title">${esc(f.route)} <span style="color:var(--muted);font-size:15px;font-weight:600">${esc(destTxt(f))}</span></div><div class="desc">${esc(f.stopName)}</div></span>
      ${etaPill(r)}</button>`;
  }
  for (const f of fk) {
    const b = live.bike?.[f.uid];
    const d = !b ? '讀取中' : (b.status != null && b.status !== 1) ? '暫停營運' : `借 <b class="${bikeCls(b.rent,b.status)}">${b.rent ?? '?'}</b>　還 <b class="${bikeCls(b.ret,b.status)}">${b.ret ?? '?'}</b>`;
    h += `<button class="card" data-act="bikeSheet" data-i="${reg({ ...f, ...(b || {}), uid:f.uid, name:f.name, fromFav:true })}">
      <span class="badge">${I.bike}</span>
      <span class="body"><div class="title">${esc(f.name)}</div><div class="desc">${d}</div></span><span class="chev">${I.chev}</span></button>`;
  }
  return h;
}
function vSearch() {
  const q = S.q.trim().toLowerCase(); const d = S.data;
  if (!d) return skel(2);
  const routes = uniqRoutes(d).filter(r => r.route.toLowerCase().includes(q));
  const stops = d.busStops.filter(s => s.name.toLowerCase().includes(q));
  const bikes = d.bikes.filter(b => b.name.toLowerCase().includes(q));
  let h = '';
  if (routes.length) h += `<div class="sec"><h2>路線</h2></div><div class="chips">` + routes.map(r => `<button class="chip" data-act="route" data-i="${reg(r)}">${esc(r.route)} <span style="color:var(--muted);font-size:14px">${esc(r.stopName)}</span></button>`).join('') + `</div>`;
  if (stops.length) h += `<div class="sec"><h2>站牌</h2></div>` + stops.map(stopCard).join('');
  if (bikes.length) h += `<div class="sec"><h2>YouBike</h2></div>` + bikes.map(bikeCard).join('');
  const rails = (d.rail || []).filter(r => (r.name + r.sys).toLowerCase().includes(q));
  if (rails.length) h += `<div class="sec"><h2>車站</h2></div>` + rails.map(railCard).join('');
  if (!h) h = `<div class="note" style="margin-top:8px">附近找不到「${esc(S.q)}」。初版只搜尋目前位置附近的路線與站點，到「設定」加大範圍可以找到更多。</div>`;
  return h;
}

function filterQ(list, f) { const q = S.q.trim().toLowerCase(); return q ? list.filter(x => f(x).toLowerCase().includes(q)) : list; }
function vBus() {
  if (S.error === 'NO_PROXY') return errBox();
  const d = S.data; let h = errBox();
  h += `<div class="sec"><h2>附近站牌</h2><span class="side">${S.settings.busR} 公尺內${d ? `，${d.busStops.length} 站` : ''}</span></div>`;
  if (!d) return h + (S.error ? '' : skel(3));
  if (d.busError) h += `<div class="note">公車資料暫時讀不到：${esc(d.busError)}</div>`;
  const stops = filterQ(d.busStops, s => s.name + ' ' + s.routes.map(r => r.route).join(' '));
  if (!stops.length) return h + `<div class="note">這個範圍內沒有公車到站資料。到「設定」把公車範圍調大。</div>`;
  return h + stops.map(s => stopBlock(s, 6)).join('');
}
function stopBlock(s, limit) {
  const rs = [...s.routes].sort((a,b) => etaRank(a) - etaRank(b));
  const shown = limit ? rs.slice(0, limit) : rs;
  return `<div class="stop"><div class="stop-h"><span class="name">${esc(s.name)}${sideTag(s)}</span><span class="pill">${distTxt(s.dist)}</span></div>
    ${shown.map(r => `<button class="rrow" data-act="route" data-i="${reg({ ...r, stopName:s.name })}"><span class="rno">${esc(r.route)}</span><span class="rdest">${esc(destTxt(r))}</span>${etaPill(r)}</button>`).join('')}
    ${limit && rs.length > limit ? `<button class="more" data-act="stop" data-i="${reg(s)}">顯示全部 ${rs.length} 條路線</button>` : ''}</div>`;
}
function vBike() {
  if (S.error === 'NO_PROXY') return errBox();
  const d = S.data; let h = errBox();
  h += `<div class="sec"><h2>附近站點</h2><span class="side">${S.settings.bikeR} 公尺內${d ? `，${d.bikes.length} 站` : ''}</span></div>`;
  if (!d) return h + (S.error ? '' : skel(3));
  if (d.bikeError) h += `<div class="note">YouBike 資料暫時讀不到：${esc(d.bikeError)}</div>`;
  const bikes = filterQ(d.bikes, b => b.name);
  if (!bikes.length) return h + `<div class="note">這個範圍內沒有 YouBike 站點。到「設定」把 YouBike 範圍調大。</div>`;
  return h + bikes.map(b => {

    return `<button class="bike" data-act="bikeSheet" data-i="${reg(b)}">

      <div class="nums">
        <div class="num"><b class="${bikeCls(b.rent,b.status)}">${off ? '—' : b.rent ?? '?'}</b><span>${off ? '暫停營運' : b.electric ? `可借（電輔 ${b.electric}）` : '可借'}</span></div>
        <div class="num"><b class="${bikeCls(b.ret,b.status)}">${off ? '—' : b.ret ?? '?'}</b><span>可還空位</span></div>
      </div></button>`;
  }).join('');
}
function seg(key, opts, fmt) {
  return `<div class="seg">${opts.map(o => `<button class="${S.settings[key]===o?'on':''}" data-act="set" data-k="${key}" data-v="${o}">${fmt(o)}</button>`).join('')}</div>`;
}
function vSettings() {
  const px = S.proxy || {};
  return `<div class="sec"><h2>資料來源</h2></div>
  <div class="set"><p>TDX 金鑰放在你的 Cloudflare Worker 裡，這裡只需要 Worker 網址。${px.fromConfig && px.url ? '目前使用 config.js 的預設網址。' : ''}</p>
    <input class="inp" id="proxyUrl" placeholder="https://jisu-tdx.你的帳號.workers.dev" autocomplete="off" autocapitalize="off" inputmode="url" value="${esc(px.url)}">

    <div class="kmsg" id="keyMsg"></div></div>
  <div class="sec"><h2>搜尋範圍</h2></div>
  <div class="set"><h3>公車站牌</h3><p>以目前位置為中心，找這個距離內的站牌。</p>${seg('busR',[200,300,500,800],v=>v+'m')}</div>
  <div class="set"><h3>YouBike 站點</h3><p>範圍越大，站點越多，讀取也越久。</p>${seg('bikeR',[300,500,800,1000],v=>v+'m')}</div>
  <div class="set"><h3>軌道：步行範圍</h3><p>只列出走得到的車站，距離以最近的出口計算。範圍內沒有車站時，改列最近的 2 站。</p>${seg('railWalk',[0.8,1.5,3],v=>v<1? v*1000+'m' : v+' 公里')}</div>

  <div class="set"><h3>要顯示的系統</h3><p>只勾你會搭的系統，其他的就不會出現。全部不勾等於全部顯示。</p>
    <div class="chips">${RAIL_SYS_OPTS.map(([k,l]) => { const on = (S.settings.railSys || []).includes(k); return `<button class="chip ${on?'chip-on':''}" data-act="railSys" data-v="${k}">${l}</button>`; }).join('')}</div></div>

  <div class="sec"><h2>關於</h2></div>
  <div class="note">極速通勤 v1　公車與 YouBike 即時資料來自交通部 TDX。<br>${DEMO ? '目前是示範資料。' : '在 Safari 按「分享 › 加入主畫面」，就能像 app 一樣全螢幕開啟。'}</div>`;
}

/* ---------- rail ---------- */
const RAIL_SYS_OPTS = [['TRA','台鐵'],['THSR','高鐵'],['TRTC','北捷'],['TYMC','桃捷'],['TMRT','中捷'],['KRTC','高捷'],['NTDLRT','淡海輕軌'],['NTALRT','安坑輕軌'],['KLRT','高雄輕軌'],['NTMC','新北捷運']];
const LINE_COLOR = {
  TRTC:{BL:'#0070BD',R:'#E3002C',G:'#008659',O:'#F8B61C',BR:'#C48C31',Y:'#FFDB00',V:'#A1D884'},
  KRTC:{R:'#E20B65',O:'#FAA73F',C:'#7CBD52'}, KLRT:{C:'#7CBD52'}, TYMC:{A:'#8246AF'},

(() => {

let favT; function refreshFavsSoon() { clearTimeout(favT); favT = setTimeout(refresh, 600); }
$('#refreshBtn').addEventListener('click', () => { refresh(); if (S.route) loadRoute(false); if (S.rail) loadRail(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; $('#qClear').hidden = !S.q; $('#main').innerHTML = ({home:vHome,bus:vBus,bike:vBike,rail:vRail,settings:vSettings})[S.tab](); });
$('#qClear').addEventListener('click', e => { e.preventDefault(); S.q = ''; $('#q').value = ''; $('#qClear').hidden = true; render(); });

setInterval(() => {
  if (!S.settings.auto || document.hidden) return;
  const due = Date.now() - S.lastFetch > S.settings.auto * 1000;
  if (due && !S.loading) { refresh(); if (S.route) loadRoute(false); if (S.rail) loadRail(); }
}, 2000);

/* ---------- boot ---------- */
async function boot() {
  render();
  try { const st = await api('loadState'); if (st?.settings) Object.assign(S.settings, st.settings); if (st?.favs) S.favs = { bus:st.favs.bus || [], bike:st.favs.bike || [] }; } catch (e) {}
  try { S.proxy = (await api('getProxy')) || {}; } catch (e) {}
  render(); refresh();
}
boot();
if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});

}
